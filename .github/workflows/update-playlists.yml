
name: Update IPTV playlists

# Regenerates M3U playlists every 2 hours and commits them
# for raw GitHub URLs and GitHub Pages hosting.

on:
  schedule:
    # Every 2 hours (UTC), 12 runs per day.
    - cron: '0 */2 * * *'

  workflow_dispatch: {}

  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/update-playlists.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-playlists
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate playlists
        env:
          ZIO_CONCURRENCY: '12'
        run: node src/index.js generate

      - name: Write generated timestamp
        run: date -u +"%Y-%m-%dT%H:%M:%SZ" > playlists/LAST_UPDATED.txt

      - name: Commit and push updated playlists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A -- playlists

          if git diff --cached --quiet; then
            echo "No playlist changes."
          else
            git commit -m "chore: refresh playlists $(date -u +%Y-%m-%dT%H:%MZ)"
          fi

          # Retry safely if main receives concurrent updates.
          for i in 1 2 3 4 5; do

            if git push origin HEAD:main; then
              echo "Successfully pushed on attempt $i"
              break
            fi

            if [ "$i" -eq 5 ]; then
              echo "ERROR: Could not push after 5 attempts."
              exit 1
            fi

            echo "Push rejected. Synchronizing with latest main..."

            # Clear any incomplete rebase.
            git rebase --abort >/dev/null 2>&1 || true

            # Fetch latest remote changes.
            git fetch origin main

            # Move local branch to latest main, preserving generated files.
            git reset --mixed origin/main

            # Re-stage generated playlists.
            git add -A -- playlists

            if git diff --cached --quiet; then
              echo "Remote already contains the generated playlists."
              break
            fi

            # Create a fresh commit on top of latest main.
            git commit -m "chore: refresh playlists $(date -u +%Y-%m-%dT%H:%MZ)"

          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: playlists

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
